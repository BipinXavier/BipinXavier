name: Update stats cards

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1

      # STATS_TOKEN is read:user only, so PR and contributed-to counts would miss private repos
      - uses: stats-organization/github-readme-stats-action@v2.1.0
        with:
          card: stats
          options: username=BipinXavier&theme=dark&show_icons=true&count_private=true&show=reviews&hide=prs,contribs
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN }}
          fail_on_error: true

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update stats cards" || exit 0
          git push
